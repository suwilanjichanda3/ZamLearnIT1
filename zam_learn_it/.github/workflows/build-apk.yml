name: Build ZamLearnIT APK

on:
  push:
    branches: [ firebase-version, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      
      - name: Install dependencies
        run: flutter pub get
        working-directory: zam_learn_it
      
      - name: Build APK
        run: flutter build apk --release
        working-directory: zam_learn_it
      
      - uses: actions/upload-artifact@v4
        with:
          name: zamlearnit-apk
          path: zam_learn_it/build/app/outputs/flutter-apk/app-release.apk