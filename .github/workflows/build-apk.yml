name: Build ZamLearnIT APK

on:
  push:
    branches: [ firebase-version, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Cache Flutter
        uses: actions/cache@v3
        with:
          path: zam_learn_it/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('zam_learn_it/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      
      - name: Install dependencies
        run: flutter pub get
        working-directory: zam_learn_it
      
      - name: Build APK
        run: flutter build apk --release
        working-directory: zam_learn_it
      
      - uses: actions/upload-artifact@v4
        with:
          name: zamlearnit-apk
          path: zam_learn_it/build/app/outputs/flutter-apk/app-release.apk